<main class="auth-shell" [dir]="langService.dir()">
  <section class="auth-panel">
    <!-- Platform Pinned Application Header -->
    <app-header [user]="null" [home]="'/'" [showMenuToggle]="false" />

    <!-- Unified Stage (Interactive Auth Card + Chic Video Showcase) -->
    <div class="auth-stage">
      <div class="auth-stage-container">
        <!-- 1. Interactive Form Card Column -->
        <div class="auth-card-wrapper">
          <router-outlet />
        </div>

        <!-- 2. Chic & Catchy Brand Video Showcase -->
        <aside class="auth-showcase-panel d-none d-lg-flex" aria-label="Wasla Platform Showcase">
          <div class="showcase-content">
            <!-- Brand Tag & Slogan Header -->
            <div class="showcase-header">
              <div class="showcase-badge">
                <i class="fa-solid fa-sparkles" aria-hidden="true"></i>
                <span>{{ 'auth.showcase.tag' | t }}</span>
              </div>
              <h2 class="showcase-slogan">{{ 'landing.hero.title' | t }}</h2>
              <p class="showcase-description">
                {{ 'landing.hero.subtitle' | t }}
              </p>
            </div>

            <!-- Video Device Frame -->
            <div class="showcase-player-frame">
              <div class="player-topbar" aria-hidden="true">
                <div class="player-live-badge">
                  <span class="live-indicator-dot"></span>
                  <span class="live-indicator-text">Live Platform</span>
                </div>
                <span class="player-title">{{ 'common.appName' | t }} Cloud</span>
              </div>
              <div class="video-ratio-box">
                <video
                  #showcaseVideo
                  class="showcase-video"
                  src="/videos/wasla-auth-showcase.mp4"
                  poster="/videos/auth-video-poster.jpg"
                  autoplay
                  muted
                  loop
                  playsinline
                  preload="auto"
                ></video>
                <div class="player-ambient-glow" aria-hidden="true"></div>
              </div>
            </div>

            <!-- Feature Highlights / Healthcare Trust Pillars -->
            <div class="showcase-features-cluster">
              <div class="showcase-feature-row showcase-pill">
                <div class="feature-icon-badge" aria-hidden="true">
                  <i class="fa-solid fa-user-doctor"></i>
                </div>
                <div class="feature-info">
                  <span class="feature-title">{{ 'auth.showcase.pillar1' | t }}</span>
                </div>
              </div>
              <div class="showcase-feature-row showcase-pill">
                <div class="feature-icon-badge" aria-hidden="true">
                  <i class="fa-solid fa-file-prescription"></i>
                </div>
                <div class="feature-info">
                  <span class="feature-title">{{ 'auth.showcase.pillar2' | t }}</span>
                </div>
              </div>
              <div class="showcase-feature-row showcase-pill">
                <div class="feature-icon-badge" aria-hidden="true">
                  <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div class="feature-info">
                  <span class="feature-title">{{ 'auth.showcase.pillar3' | t }}</span>
                </div>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </section>
</main>
