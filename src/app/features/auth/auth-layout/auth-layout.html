<main class="auth-split-layout" [dir]="langService.dir()">
  <!-- 1. Left Showcase Pane (~55% Desktop) — True Visual Match to Reference Mockup -->
  <aside class="auth-showcase-pane d-none d-lg-flex" aria-label="Wasla Platform Showcase">
    <!-- Ambient Pulse Wave Icon (Top-Left) -->
    <div class="showcase-ambient-wave" aria-hidden="true">
      <svg class="heartbeat-line" viewBox="0 0 100 40" preserveAspectRatio="none">
        <path
          d="M0 20 L35 20 L42 6 L49 34 L56 12 L62 26 L67 20 L100 20"
          fill="none"
          stroke="rgba(8, 183, 181, 0.45)"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <div class="showcase-content-wrapper">
      <!-- Top Headline & Description -->
      <header class="showcase-header">
        <h1 class="showcase-title">
          <span>{{ 'auth.showcase.headline' | t }}</span>
          <span class="highlight-wrapper">
            <svg class="teal-curve-svg" viewBox="0 0 140 18" fill="none" preserveAspectRatio="none" aria-hidden="true">
              <path d="M4 14 C42 4 98 4 136 14" stroke="#08B7B5" stroke-width="3.5" stroke-linecap="round" />
            </svg>
          </span>
        </h1>
        <p class="showcase-lead">
          {{ 'auth.showcase.subtext' | t }}
        </p>
      </header>

      <!-- Center: Laptop Dashboard Preview Graphic -->
      <div class="showcase-laptop-stage">
        <img
          src="/images/auth/wasla-product-preview.webp"
          alt="Wasla Clinic Management Platform"
          class="laptop-preview-image"
          loading="eager"
          decoding="async"
        />
      </div>

      <!-- Bottom: 3 Compact Feature Tiles -->
      <div class="showcase-feature-tiles">
        <div class="feature-tile-box">
          <div class="tile-icon-bubble" aria-hidden="true">
            <i class="fa-solid fa-file-prescription"></i>
          </div>
          <span class="tile-text">{{ 'auth.showcase.feature1' | t }}</span>
        </div>

        <div class="feature-tile-box">
          <div class="tile-icon-bubble" aria-hidden="true">
            <i class="fa-solid fa-shield-halved"></i>
          </div>
          <span class="tile-text">{{ 'auth.showcase.feature2' | t }}</span>
        </div>

        <div class="feature-tile-box">
          <div class="tile-icon-bubble" aria-hidden="true">
            <i class="fa-solid fa-file-waveform"></i>
          </div>
          <span class="tile-text">{{ 'auth.showcase.feature3' | t }}</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- 2. Right Form Pane (~45% Desktop, 100% Mobile) — Clean Pure White Surface -->
  <section class="auth-form-pane">
    <div class="auth-form-container">
      <router-outlet />
    </div>
  </section>
</main>
