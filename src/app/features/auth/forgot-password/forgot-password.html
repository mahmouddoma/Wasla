<div class="auth-form-wrap">
  <a class="back-link" routerLink="/login">{{ 'register.backToLogin' | t }}</a>
  <header class="auth-form-heading">
    <h1>{{ 'ui.full.244' | t }}</h1>
    <p>{{ 'ui.full.245' | t }}</p>
  </header>
  @if (recoveryStatus === 'challenge-expired') {
    <div class="form-notice info" role="status">
      {{ 'ui.full.246' | t }}
    </div>
  }
  @if (apiMessages().length) {
    <div class="form-notice error" role="alert">
      @for (message of apiMessages(); track message) {
        <p>{{ message | t }}</p>
      }
    </div>
  }
  <form class="auth-form" (submit)="onSubmit($event)" novalidate>
    <label class="form-field"
      ><span>{{ 'workspace.email' | t }}</span
      ><input
        type="email"
        autocomplete="email"
        [formField]="resetForm.email"
        [placeholder]="'auth.emailExample' | t"
      />
      @if (resetForm.email().touched() && resetForm.email().errors().length) {
        <small class="field-error">{{ (resetForm.email().errors()[0].message ?? '') | t }}</small>
      }
      @if (serverError()) {
        <small class="field-error">{{ serverError() }}</small>
      }
    </label>
    <button class="btn btn-primary auth-submit" type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? uiLanguage.t('ui.full.627') : uiLanguage.t('ui.expressions.125') }}
    </button>
  </form>
</div>
