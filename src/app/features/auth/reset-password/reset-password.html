<div class="auth-form-wrap">
  <header class="auth-form-heading">
    <h1>{{ 'ui.full.268' | t }}</h1>
    <p>{{ 'ui.full.269' | t }}</p>
  </header>

  @if (expiresAt()) {
    <div class="form-notice info expiry-note" role="status">
      {{ 'ui.full.270' | t }} <strong>{{ expiresAt() }}</strong
      >.
    </div>
  }

  @if (apiMessages().length) {
    <div class="form-notice error" role="alert">
      @for (message of apiMessages(); track message) {
        <p>{{ message | t }}</p>
      }
    </div>
  }

  <form class="auth-form" (submit)="onSubmit($event)" novalidate>
    <label class="form-field">
      <span>{{ 'changePassword.newLabel' | t }}</span>
      <span class="password-control">
        <input
          [type]="showPasswords() ? 'text' : 'password'"
          autocomplete="new-password"
          [formField]="passwordForm.newPassword"
        />
        <button type="button" (click)="togglePasswords()">
          {{ showPasswords() ? uiLanguage.t('ui.expressions.132') : uiLanguage.t('ui.expressions.133') }}
        </button>
      </span>
      @if (passwordForm.newPassword().touched() && passwordForm.newPassword().errors().length) {
        <small class="field-error">{{ (passwordForm.newPassword().errors()[0].message ?? '') | t }}</small>
      }
      @if (serverError('newPassword')) {
        <small class="field-error">{{ serverError('newPassword') }}</small>
      }
    </label>

    <label class="form-field">
      <span>{{ 'changePassword.confirmLabel' | t }}</span>
      <input
        [type]="showPasswords() ? 'text' : 'password'"
        autocomplete="new-password"
        [formField]="passwordForm.confirmPassword"
      />
      @if (
        passwordForm.confirmPassword().touched() && passwordForm.confirmPassword().errors().length
      ) {
        <small class="field-error">{{ (passwordForm.confirmPassword().errors()[0].message ?? '') | t }}</small>
      }
      @if (serverError('confirmPassword')) {
        <small class="field-error">{{ serverError('confirmPassword') }}</small>
      }
    </label>

    <button class="btn btn-primary auth-submit" type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? uiLanguage.t('common.saving') : uiLanguage.t('ui.expressions.134') }}
    </button>
  </form>
</div>
