<div class="auth-form-wrap">
  <div class="sent-mark" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></svg>
  </div>
  <header class="auth-form-heading">
    <h1>تحقق من بريدك</h1>
    <p>{{ apiMessage() || 'إذا كان البريد مسجلًا، ستصلك رسالة تحتوي على رمز التحقق.' }}</p>
  </header>
  <div class="form-notice info" role="status">
    تم حفظ معرّف الطلب داخليًا لاستخدامه في خطوة تأكيد الرمز.
  </div>
  @if (apiErrors().length) {
    <div class="form-notice error" role="alert">
      @for (message of apiErrors(); track message) {
        <p>{{ message }}</p>
      }
    </div>
  }
  <div class="otp-actions">
    <button
      class="btn btn-primary auth-submit"
      type="button"
      [disabled]="isResending()"
      (click)="resend()"
    >
      {{ isResending() ? 'جارٍ إعادة الإرسال…' : 'إعادة إرسال الرمز' }}
    </button>
    <a class="btn btn-outline-secondary auth-submit" routerLink="/login">العودة إلى تسجيل الدخول</a>
  </div>
</div>
