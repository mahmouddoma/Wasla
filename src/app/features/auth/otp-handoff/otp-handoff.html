<div class="auth-form-wrap">
  <a class="back-link" routerLink="/forgot-password">{{ 'ui.full.253' | t }}</a>
  <div class="sent-mark" aria-hidden="true">
    <svg viewBox="0 0 24 24">
      <path d="M4 6h16v12H4zM4 7l8 6 8-6" />
    </svg>
  </div>
  <header class="auth-form-heading">
    <h1>{{ 'ui.full.254' | t }}</h1>
    <p>
      {{
        challenge()?.message ||
          uiLanguage.t('ui.expressions.126')
      }}
    </p>
  </header>

  @if (apiMessages().length) {
    <div class="form-notice error" role="alert">
      @for (message of apiMessages(); track message) {
        <p>{{ message | t }}</p>
      }
    </div>
  }

  @if (challengeUnavailable()) {
    <div class="form-notice info" role="status">
      {{ 'ui.full.255' | t }}
    </div>
  }

  <form class="auth-form" (submit)="onSubmit($event)" novalidate>
    <label class="form-field">
      <span>{{ 'ui.full.256' | t }}</span>
      <input
        class="otp-input"
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        dir="ltr"
        [formField]="otpForm.otp"
        placeholder="000000"
        (input)="normalizeOtp($event)"
      />
      @if (otpForm.otp().touched() && otpForm.otp().errors().length) {
        <small class="field-error">{{ (otpForm.otp().errors()[0].message ?? '') | t }}</small>
      }
      @if (serverError()) {
        <small class="field-error">{{ serverError() }}</small>
      }
    </label>

    <button
      class="btn btn-primary auth-submit"
      type="submit"
      [disabled]="isSubmitting() || isResending() || challengeUnavailable()"
    >
      {{ isSubmitting() ? uiLanguage.t('ui.expressions.127') : uiLanguage.t('ui.expressions.128') }}
    </button>
  </form>

  <div class="otp-actions">
    <span>{{ 'ui.full.257' | t }}</span>
    <button
      type="button"
      [disabled]="isResending() || isSubmitting() || resendCooldown() > 0"
      (click)="resend()"
    >
      {{
        isResending()
          ? uiLanguage.t('ui.expressions.129')
          : resendCooldown() > 0
            ? uiLanguage.t('ui.expressions.130') + ' ' + resendCooldown() + ' ' + uiLanguage.t('ui.expressions.131')
            : uiLanguage.t('common.resubmit')
      }}
    </button>
  </div>
</div>
