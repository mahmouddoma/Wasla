<div class="upload-field" [class.has-file]="fileName()" [class.has-error]="error()">
  <div class="upload-copy">
    <strong>{{ label() }}</strong>
    <span class="badge-status" [class.required-badge]="required()">{{
      required() ? uiLanguage.t('ui.expressions.122') : uiLanguage.t('common.optional')
    }}</span>
  </div>
  <div class="file-picker">
    <input
      #fileInput
      type="file"
      accept="image/*"
      tabindex="-1"
      (change)="selectFile($event)"
      [attr.aria-label]="label()"
    />
    <button type="button" class="btn-pick-file" (click)="fileInput.click()">
      <svg
        viewBox="0 0 24 24"
        width="14"
        height="14"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="17 8 12 3 7 8" />
        <line x1="12" y1="3" x2="12" y2="15" />
      </svg>
      <span>{{ 'ui.full.242' | t }}</span>
    </button>
    <span class="file-name-text">{{ fileName() || uiLanguage.t('ui.expressions.123') }}</span>
  </div>
  @if (fileName()) {
    <div class="file-preview">
      @if (previewUrl()) {
        <img [src]="previewUrl()" [alt]="uiLanguage.t('ui.full.649') + ' ' + label()" class="preview-thumb" />
      }
      @if (!required()) {
        <button
          type="button"
          class="btn-remove-file"
          (click)="removeFile(fileInput)"
          [attr.aria-label]="uiLanguage.t('ui.expressions.124') + ' ' + label()"
        >
          {{ 'ui.full.243' | t }}
        </button>
      }
    </div>
  }
  @if (error()) {
    <small class="upload-error" role="alert">{{ error() }}</small>
  }
</div>
