<div class="auth-form-wrap">
  <header class="auth-form-heading">
    <h1>تغيير كلمة المرور</h1>
    <p>يجب تحديث كلمة المرور قبل الوصول إلى باقي النظام.</p>
  </header>
  @if (apiMessages().length) {
    <div class="form-notice error" role="alert">
      @for (message of apiMessages(); track message) {
        <p>{{ message }}</p>
      }
    </div>
  }
  <form class="auth-form" (submit)="onSubmit($event)" novalidate>
    <label class="form-field"
      ><span>كلمة المرور الحالية</span
      ><input
        [type]="showPasswords() ? 'text' : 'password'"
        autocomplete="current-password"
        [formField]="passwordForm.currentPassword"
      />
      @if (
        passwordForm.currentPassword().touched() && passwordForm.currentPassword().errors().length
      ) {
        <small class="field-error">{{ passwordForm.currentPassword().errors()[0].message }}</small>
      }
      @if (serverError('currentPassword')) {
        <small class="field-error">{{ serverError('currentPassword') }}</small>
      }
    </label>
    <label class="form-field"
      ><span>كلمة المرور الجديدة</span
      ><input
        [type]="showPasswords() ? 'text' : 'password'"
        autocomplete="new-password"
        [formField]="passwordForm.newPassword"
      />
      @if (passwordForm.newPassword().touched() && passwordForm.newPassword().errors().length) {
        <small class="field-error">{{ passwordForm.newPassword().errors()[0].message }}</small>
      }
      @if (serverError('newPassword')) {
        <small class="field-error">{{ serverError('newPassword') }}</small>
      }
    </label>
    <label class="form-field"
      ><span>تأكيد كلمة المرور الجديدة</span
      ><input
        [type]="showPasswords() ? 'text' : 'password'"
        autocomplete="new-password"
        [formField]="passwordForm.confirmPassword"
      />
      @if (
        passwordForm.confirmPassword().touched() && passwordForm.confirmPassword().errors().length
      ) {
        <small class="field-error">{{ passwordForm.confirmPassword().errors()[0].message }}</small>
      }
      @if (serverError('confirmPassword')) {
        <small class="field-error">{{ serverError('confirmPassword') }}</small>
      }
    </label>
    <label class="form-check-line"
      ><input type="checkbox" [checked]="showPasswords()" (change)="togglePasswords()" /> إظهار
      كلمات المرور</label
    >
    <button class="btn btn-primary auth-submit" type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'جارٍ الحفظ…' : 'تغيير كلمة المرور' }}
    </button>
  </form>
</div>
