<div class="admin-shell" [dir]="langService.dir()">
  <!-- Mobile Sidebar Overlay -->
  @if (isSidebarOpen()) {
    <div class="sidebar-backdrop" (click)="closeSidebar()" aria-hidden="true"></div>
  }

  <!-- Sidebar -->
  <aside
    class="admin-sidebar"
    id="admin-sidebar"
    [class.open]="isSidebarOpen()"
    [class.collapsed]="isSidebarCollapsed() && !isSidebarOpen()"
    [attr.aria-label]="'admin.mainNav' | t"
  >
    <!-- Sidebar Brand -->
    <div class="sidebar-brand-header">
      <a
        class="sidebar-brand-link"
        [routerLink]="home()"
        (click)="closeSidebar()"
        [attr.aria-label]="'common.home' | t"
        [title]="'common.home' | t"
      >
        <div class="brand-logo-icon">
          <img
            src="/images/logo-light.png"
            width="40"
            height="40"
            [alt]="'common.appName' | t"
            decoding="async"
          />
        </div>
        <div class="brand-text-block">
          <strong class="brand-app-name">{{ 'common.waslaPlatform' | t }}</strong>
          <span class="brand-app-tagline">{{ 'common.betterCare' | t }}</span>
        </div>
      </a>

      <!-- Desktop Collapse Button -->
      <button
        type="button"
        class="btn-sidebar-collapse"
        (click)="toggleSidebarCollapse()"
        [attr.aria-label]="
          isSidebarCollapsed()
            ? langService.t('ui.expressions.7')
            : langService.t('ui.expressions.8')
        "
        [title]="
          isSidebarCollapsed()
            ? langService.t('ui.expressions.7')
            : langService.t('ui.expressions.8')
        "
      >
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <path d="M9 3v18" />
          <path d="m14 9 3 3-3 3" class="collapse-chevron" />
        </svg>
      </button>

      <!-- Mobile Close Button -->
      <button
        type="button"
        class="btn-sidebar-close"
        (click)="closeSidebar()"
        [attr.aria-label]="'common.closeMenu' | t"
      >
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>

    <!-- Navigation List -->
    <nav class="sidebar-nav">
      @for (item of navItems(); track item.id) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          class="sidebar-nav-item"
          [title]="item.labelKey | t"
          (click)="closeSidebar()"
        >
          <svg
            class="sidebar-nav-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path [attr.d]="navigationIcons[item.icon]" />
          </svg>
          <span class="nav-text">{{ item.labelKey | t }}</span>
        </a>
      }
    </nav>
    <!-- Sidebar Bottom: Logout -->
    <div class="sidebar-footer">
      <button
        class="btn-sidebar-logout"
        type="button"
        (click)="logout()"
        [attr.aria-label]="'common.logout' | t"
        [title]="'common.logout' | t"
      >
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        <span class="nav-text">{{ 'common.logout' | t }}</span>
      </button>
    </div>
  </aside>

  <!-- Main Content Layout (Topbar + Body) -->
  <div class="admin-main-wrapper">
    <app-header
      [user]="user()"
      [home]="home()"
      menuId="admin-sidebar"
      [menuExpanded]="isSidebarOpen()"
      (menuToggle)="toggleSidebar()"
      (logout)="logout()"
    />

    <!-- Page Content Area -->
    <main class="admin-content-body">
      <router-outlet />
    </main>
    <app-mobile-navigation
      [items]="mobileNavItems()"
      menuId="admin-sidebar"
      [menuExpanded]="isSidebarOpen()"
      (more)="toggleSidebar()"
      (navigate)="closeSidebar()"
    />
  </div>
</div>
