<div class="admin-shell" dir="rtl">
  <header class="admin-header">
    <div class="header-inner">
      <a class="admin-brand" [routerLink]="home()" aria-label="وصلة - الصفحة الرئيسية">
        <img src="/images/wasla-mark.png" width="1254" height="1254" alt="" />
      </a>
      @if (canViewDoctors() || canViewSuperAdmins() || canViewRoles()) {
        <nav aria-label="التنقل الرئيسي">
          @if (canViewDoctors()) {
            <a
              routerLink="/admin/doctors"
              [class.active]="isCurrent('/admin/doctors')"
              [attr.aria-current]="isCurrent('/admin/doctors') ? 'page' : null"
              >إدارة الأطباء</a
            >
          }
          @if (canViewSuperAdmins()) {
            <a
              routerLink="/admin/superadmins"
              [class.active]="isCurrent('/admin/superadmins')"
              [attr.aria-current]="isCurrent('/admin/superadmins') ? 'page' : null"
              >إدارة المشرفين</a
            >
          }
          @if (canViewRoles()) {
            <a
              routerLink="/admin/roles"
              [class.active]="isCurrent('/admin/roles')"
              [attr.aria-current]="isCurrent('/admin/roles') ? 'page' : null"
              >الأدوار والصلاحيات</a
            >
          }
        </nav>
      }
      <div class="admin-account">
        <span>{{ user()?.userName }}</span>
        <button class="btn btn-outline-secondary" type="button" (click)="logout()">
          تسجيل الخروج
        </button>
      </div>
    </div>
  </header>
  <main class="admin-content"><router-outlet /></main>
</div>
