<section class="create-page">
  <a class="page-back" routerLink="/admin/superadmins">{{ 'admin.backToSuperadmins' | t }}</a>
  <header>
    <h1>{{ 'ui.full.127' | t }}</h1>
    <p>{{ 'ui.full.128' | t }}</p>
  </header>
  <div class="form-surface">
    <app-superadmin-form
      mode="create"
      [busy]="isSubmitting()"
      [messages]="apiMessages()"
      [fieldErrors]="fieldErrors()"
      (saved)="create($event)"
    />
  </div>
</section>
