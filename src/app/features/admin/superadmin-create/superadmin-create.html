<section class="create-page">
  <a class="page-back" routerLink="/admin/superadmins">العودة إلى قائمة المشرفين</a>
  <header>
    <h1>إنشاء SuperAdmin</h1>
    <p>أنشئ حساب مشرف عادي بكلمة مرور أولية. لا يمكن إنشاء Root من هذه الشاشة.</p>
  </header>
  <div class="form-surface">
    <app-superadmin-form
      mode="create"
      [busy]="isSubmitting()"
      [messages]="apiMessages()"
      [fieldErrors]="fieldErrors()"
      (saved)="create($event)"
    />
  </div>
</section>
