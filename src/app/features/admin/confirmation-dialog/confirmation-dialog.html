<dialog
  [attr.aria-labelledby]="dialogId() + '-title'"
  [attr.aria-describedby]="dialogId() + '-description'"
  (cancel)="onCancel($event)"
>
  <header>
    <div>
      <h2 [id]="dialogId() + '-title'">{{ title() }}</h2>
      <p [id]="dialogId() + '-description'">{{ description() }}</p>
    </div>
    <button type="button" aria-label="إغلاق" [disabled]="busy()" (click)="close()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" /></svg>
    </button>
  </header>

  @if (messages().length) {
    <div class="dialog-errors" role="alert">
      @for (message of messages(); track message) {
        <p>{{ message }}</p>
      }
    </div>
  }

  <footer>
    <button
      class="btn btn-outline-secondary"
      data-cancel
      type="button"
      [disabled]="busy()"
      (click)="close()"
    >
      إلغاء
    </button>
    <button
      class="btn"
      [class.btn-primary]="!danger()"
      [class.btn-danger]="danger()"
      type="button"
      [disabled]="busy()"
      (click)="confirmed.emit()"
    >
      {{ busy() ? 'جارٍ التنفيذ…' : confirmLabel() }}
    </button>
  </footer>
</dialog>
