<main class="workspace-empty" dir="rtl">
  <section>
    <span class="connected-status"><i></i> جلسة آمنة ومتصلة</span>
    <h1>مرحبًا، {{ user()?.userName }}</h1>
    <p>تم تحميل حسابك وصلاحياتك من وصلة بنجاح. ستظهر وحدات العمل هنا عند ربط Jira الخاصة بها.</p>
    <dl>
      <div>
        <dt>نوع الحساب</dt>
        <dd>{{ user()?.userType }}</dd>
      </div>
      <div>
        <dt>البريد الإلكتروني</dt>
        <dd>{{ user()?.email }}</dd>
      </div>
    </dl>
    <button class="btn btn-outline-secondary" type="button" (click)="logout()">تسجيل الخروج</button>
  </section>
</main>
