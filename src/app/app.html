<main class="app-main-viewport">
  @if (revalidation.unavailable()) {
    <div class="session-verification" role="status" aria-live="polite" [attr.dir]="language.dir()">
      <p>{{ 'sessionVerification.unavailable' | t }}</p>
      <button type="button" class="btn btn-outline-secondary" [disabled]="revalidation.checking()" (click)="retrySession()">{{ (revalidation.checking() ? 'common.loading' : 'common.retry') | t }}</button>
    </div>
  }
  <router-outlet />
</main>
<app-platform-footer />
<app-toast-container />
