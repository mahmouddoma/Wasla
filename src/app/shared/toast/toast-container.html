<section class="toast-region" aria-label="الإشعارات" aria-live="polite" aria-relevant="additions">
  @for (item of toast.messages(); track item.id) {
    <article
      class="toast-message"
      [class.toast-message--success]="item.kind === 'success'"
      [class.toast-message--error]="item.kind === 'error'"
      [attr.role]="item.kind === 'error' ? 'alert' : 'status'"
    >
      <span class="toast-icon" aria-hidden="true">
        @if (item.kind === 'success') {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="m8 12 2.5 2.5L16 9" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v6" />
            <path d="M12 17h.01" />
          </svg>
        }
      </span>
      <p>{{ item.message }}</p>
      <button
        type="button"
        class="toast-close"
        [attr.aria-label]="item.kind === 'success' ? 'إغلاق رسالة النجاح' : 'إغلاق رسالة الخطأ'"
        (click)="toast.dismiss(item.id)"
      >
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </article>
  }
</section>
