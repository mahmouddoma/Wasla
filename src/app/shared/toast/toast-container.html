<section class="toast-region" [attr.aria-label]="'ui.full.769' | t" aria-live="polite" aria-relevant="additions">
  @for (item of toast.messages(); track item.id) {
    <article
      class="toast-message"
      [class.toast-message--success]="item.kind === 'success'"
      [class.toast-message--error]="item.kind === 'error'"
      [attr.role]="item.kind === 'error' ? 'alert' : 'status'"
    >
      <div class="toast-accent-strip" aria-hidden="true"></div>
      <div class="toast-icon-wrap" aria-hidden="true">
        @if (item.kind === 'success') {
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
        }
      </div>
      <div class="toast-text-group">
        <strong class="toast-title">
          {{ item.title ? (item.title | t) : (item.kind === 'success' ? ('common.success' | t) : ('common.notice' | t)) }}
        </strong>
        <p class="toast-message-body">{{ item.message | t }}</p>
      </div>
      <button
        type="button"
        class="toast-close"
        [attr.aria-label]="item.kind === 'success' ? uiLanguage.t('ui.expressions.222') : uiLanguage.t('ui.expressions.223')"
        (click)="toast.dismiss(item.id)"
      >
        <svg
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
        >
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
      <div
        class="toast-timer-line"
        [style.animation-duration.ms]="item.duration"
        aria-hidden="true"
      ></div>
    </article>
  }
</section>
