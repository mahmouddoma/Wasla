<div class="selector-wrapper" role="group" aria-label="اختيار التخصصات الطبية">
  <!-- Search and summary toolbar -->
  <div class="selector-toolbar">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input
        type="text"
        role="searchbox"
        placeholder="ابحث في التخصصات الطبية بالاسم…"
        [value]="searchTerm()"
        (input)="searchTerm.set($any($event.target).value)"
        class="search-input"
      />
      @if (searchTerm()) {
        <button type="button" class="btn-clear" (click)="searchTerm.set('')" aria-label="مسح البحث">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      }
    </div>
    <div class="selection-pill">
      <span>المحدد: <strong>{{ selected().length }}</strong></span>
    </div>
  </div>

  <!-- Multi-column Grid of specialties -->
  <div class="selector-grid">
    @for (option of filteredOptions(); track option.id) {
      <article
        class="specialty-card"
        [class.selected]="selectedIds().has(option.id)"
        [class.is-primary]="isPrimary(option.id)"
      >
        <label class="card-label">
          <input
            type="checkbox"
            class="card-checkbox"
            [checked]="selectedIds().has(option.id)"
            [disabled]="disabled()"
            (change)="toggle(option.id, $event)"
          />
          <div class="card-text">
            <strong class="name-ar">{{ option.nameAr }}</strong>
            @if (option.nameEn) {
              <small class="name-en" lang="en" dir="ltr">{{ option.nameEn }}</small>
            }
          </div>
        </label>

        @if (selectedIds().has(option.id)) {
          <div class="primary-action-wrap">
            @if (isPrimary(option.id)) {
              <span class="badge-primary-active" aria-label="التخصص الأساسي">
                <svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor" aria-hidden="true">
                  <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                </svg>
                <span>التخصص الأساسي</span>
              </span>
            } @else {
              <button
                type="button"
                class="btn-make-primary"
                [disabled]="disabled()"
                (click)="makePrimary(option.id)"
                title="تعيين كتخصص أساسي"
              >
                <span>تعيين كأساسي</span>
              </button>
            }
          </div>
        }
      </article>
    } @empty {
      <div class="empty-search-state">
        <p>لا توجد تخصصات مطابقة للبحث "{{ searchTerm() }}"</p>
      </div>
    }
  </div>
</div>
