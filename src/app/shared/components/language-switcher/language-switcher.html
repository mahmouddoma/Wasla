<button
  type="button"
  class="lang-btn"
  [class.pill]="variant() === 'pill'"
  [class.header-btn]="variant() === 'header'"
  (click)="toggle()"
  [attr.aria-label]="langService.t('lang.switchLabel')"
  [title]="langService.t('lang.switchTarget')"
>
  <svg
    class="lang-globe-icon"
    viewBox="0 0 24 24"
    width="16"
    height="16"
    fill="none"
    stroke="currentColor"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <line x1="0.5" y1="3.35" x2="12" y2="3.35" />
    <line x1="6.25" y1="0.48" x2="6.25" y2="3.35" />
    <path d="M9.12 3.35c0 3.52-3.28 8.2-7.66 10.55" />
    <path d="M4.51 7.37A16.4 16.4 0 0 0 11 13.9" />
    <polyline points="12.96 22.52 16.79 11.98 17.75 11.98 21.58 22.52" />
    <line x1="20.43" y1="18.69" x2="15.07" y2="18.69" />
    <line x1="11.04" y1="22.52" x2="14.88" y2="22.52" />
    <line x1="19.67" y1="22.52" x2="23.5" y2="22.52" />
  </svg>
  <span class="lang-label">{{ langService.t('lang.switchTarget') }}</span>
  <span class="lang-tag">{{ langService.t('lang.switchTag') }}</span>
</button>
