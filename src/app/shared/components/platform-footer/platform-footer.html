<footer class="platform-footer" [dir]="langService.dir()" role="contentinfo">
  <div class="footer-container">
    <!-- Brand Identity & Logo -->
    <div class="footer-brand-section">
      <a routerLink="/" class="footer-logo-badge" [attr.aria-label]="'common.appName' | t">
        <img
          class="footer-brand-logo"
          src="/images/wasla-mark.png"
          width="32"
          height="32"
          [alt]="'common.appName' | t"
          loading="lazy"
          decoding="async"
        />
        <div class="brand-text-block">
          <span class="brand-name">{{ 'common.waslaPlatform' | t }}</span>
          <span class="brand-tagline">{{ 'footer.tagline' | t }}</span>
        </div>
      </a>
    </div>

    <!-- Quick Navigation Links (Clean text links, NOT button pills) -->
    <nav class="footer-nav" [attr.aria-label]="'common.appName' | t">
      <a class="footer-nav-btn" routerLink="/privacy">
        {{ 'footer.privacyPolicy' | t }}
      </a>
      <span class="footer-divider" aria-hidden="true">•</span>
      <a class="footer-nav-btn" routerLink="/terms">
        {{ 'footer.termsOfUse' | t }}
      </a>
      <span class="footer-divider" aria-hidden="true">•</span>
      <a class="footer-nav-btn" routerLink="/help">
        {{ 'footer.helpCenter' | t }}
      </a>
    </nav>

    <!-- Platform Copyright (Clean typographic text, no button boxes) -->
    <div class="footer-meta-section">
      <p class="copyright-text">{{ 'footer.copyright' | t }}</p>
    </div>
  </div>
</footer>
