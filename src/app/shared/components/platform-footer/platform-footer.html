<footer class="platform-footer" [dir]="langService.dir()" role="contentinfo">
  <div class="footer-inner">
    <!-- Brand & Platform Identity -->
    <div class="footer-brand-wrap">
      <img
        class="footer-logo"
        src="/images/wasla-mark.png"
        width="20"
        height="20"
        [alt]="'common.appName' | t"
      />
      <div class="footer-brand-info">
        <span class="brand-name">{{ 'common.appName' | t }}</span>
        <span class="footer-dot" aria-hidden="true">•</span>
        <span class="brand-tagline">{{ 'footer.tagline' | t }}</span>
      </div>
    </div>

    <!-- Quick Navigation Links (Dedicated Pages) -->
    <nav class="footer-nav" [attr.aria-label]="'common.appName' | t">
      <a class="footer-nav-btn" routerLink="/privacy">
        {{ 'footer.privacyPolicy' | t }}
      </a>
      <span class="footer-dot" aria-hidden="true">•</span>
      <a class="footer-nav-btn" routerLink="/terms">
        {{ 'footer.termsOfUse' | t }}
      </a>
      <span class="footer-dot" aria-hidden="true">•</span>
      <a class="footer-nav-btn" routerLink="/help">
        {{ 'footer.helpCenter' | t }}
      </a>
    </nav>

    <!-- Platform Copyright & Version (Calm, Unified, No Cluttered Badges or Green Icons) -->
    <div class="footer-meta-wrap">
      <span class="copyright-text">{{ 'footer.copyright' | t }}</span>
      <span class="footer-dot" aria-hidden="true">•</span>
      <span class="version-badge" dir="ltr">{{ version }}</span>
    </div>
  </div>
</footer>
