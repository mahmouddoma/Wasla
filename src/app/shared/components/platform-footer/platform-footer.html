<footer class="platform-footer" [dir]="langService.dir()" role="contentinfo">
  <div class="footer-inner">
    <!-- Brand & Platform Identity -->
    <div class="footer-brand-wrap">
      <a routerLink="/" class="footer-logo-badge" [attr.aria-label]="'common.appName' | t">
        <img
          class="footer-brand-logo"
          src="/images/white-text-logo.png"
          [alt]="('common.appName' | t) + ' - ' + ('footer.tagline' | t)"
          loading="lazy"
        />
      </a>
      <!-- Accessible Semantic Labels for Screen Readers & Tests -->
      <span class="brand-name sr-only">{{ 'common.appName' | t }}</span>
      <span class="brand-tagline sr-only">{{ 'footer.tagline' | t }}</span>

      <!-- Discreet Trust / Healthcare Security Tag -->
      <div class="footer-trust-tag" [title]="'footer.securityBadge' | t">
        <span class="trust-dot" aria-hidden="true"></span>
        <span class="trust-label">{{ 'footer.securityBadge' | t }}</span>
      </div>
    </div>

    <!-- Quick Navigation Links -->
    <nav class="footer-nav" [attr.aria-label]="'common.appName' | t">
      <a class="footer-nav-btn" routerLink="/privacy">
        <svg
          class="nav-icon"
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        </svg>
        <span>{{ 'footer.privacyPolicy' | t }}</span>
      </a>
      <span class="footer-separator" aria-hidden="true"></span>
      <a class="footer-nav-btn" routerLink="/terms">
        <svg
          class="nav-icon"
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
          <line x1="16" y1="13" x2="8" y2="13" />
          <line x1="16" y1="17" x2="8" y2="17" />
        </svg>
        <span>{{ 'footer.termsOfUse' | t }}</span>
      </a>
      <span class="footer-separator" aria-hidden="true"></span>
      <a class="footer-nav-btn" routerLink="/help">
        <svg
          class="nav-icon"
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="10" />
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
        <span>{{ 'footer.helpCenter' | t }}</span>
      </a>
    </nav>

    <!-- Platform Copyright & Version -->
    <div class="footer-meta-wrap">
      <span class="copyright-text">{{ 'footer.copyright' | t }}</span>
      <span class="footer-separator" aria-hidden="true"></span>
      <span class="version-badge" dir="ltr" [title]="('footer.version' | t) + ' ' + version">{{
        version
      }}</span>
    </div>
  </div>
</footer>
