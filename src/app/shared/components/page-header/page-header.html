<header class="page-header">
  <div class="page-header__intro">
    <span class="page-header__icon" aria-hidden="true">
      @switch (icon()) {
        @case ('doctors') {
          <svg viewBox="0 0 24 24">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M19 8v6M16 11h6" />
          </svg>
        }
        @case ('admins') {
          <svg viewBox="0 0 24 24">
            <path d="M12 3 5 6v5c0 4.6 2.9 8 7 10 4.1-2 7-5.4 7-10V6l-7-3Z" />
            <circle cx="12" cy="10" r="2.2" />
            <path d="M8.8 16c.7-1.6 1.8-2.4 3.2-2.4s2.5.8 3.2 2.4" />
          </svg>
        }
        @case ('roles') {
          <svg viewBox="0 0 24 24">
            <rect x="4" y="10" width="16" height="11" rx="2" />
            <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3" />
          </svg>
        }
        @case ('specializations') {
          <svg viewBox="0 0 24 24">
            <path d="M3 12h4l2.2-6 4.2 12 2.1-6H21" />
          </svg>
        }
        @case ('requests') {
          <svg viewBox="0 0 24 24">
            <path d="M9 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3" />
            <rect x="9" y="3" width="6" height="4" rx="1" />
            <path d="m8 14 2.2 2.2L16 10.5" />
          </svg>
        }
      }
    </span>

    <div class="page-header__copy">
      <h1>{{ heading() }}</h1>
      <p>{{ description() }}</p>
    </div>
  </div>

  <div class="page-header__actions">
    <ng-content select="[pageHeaderActions]" />
  </div>
</header>
