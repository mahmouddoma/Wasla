<nav [attr.aria-label]="'navigation.mobile' | t">
  @for (item of items(); track item.id) {
    <a
      [routerLink]="item.route"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: item.id === 'drug-catalog' }"
      (click)="navigate.emit()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="icons[item.icon]" /></svg>
      <span>{{ item.mobileLabelKey || item.labelKey | t }}</span>
    </a>
  }
  <button
    type="button"
    [class.active]="moreActive()"
    [attr.aria-controls]="menuId()"
    [attr.aria-expanded]="menuExpanded()"
    (click)="more.emit()"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
    <span>{{ 'navigation.more' | t }}</span>
  </button>
</nav>
