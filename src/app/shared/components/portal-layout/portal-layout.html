<div class="portal-shell" [dir]="langService.dir()">
  <!-- Mobile Sidebar Backdrop Overlay -->
  @if (isSidebarOpen()) {
    <div class="sidebar-backdrop" (click)="closeSidebar()" aria-hidden="true"></div>
  }

  <!-- Persistent Collapsible Sidebar -->
  <aside
    class="portal-sidebar"
    [class.open]="isSidebarOpen()"
    [class.collapsed]="isSidebarCollapsed()"
    [attr.aria-label]="'sidebar.workspace' | t"
  >
    <!-- Sidebar Brand -->
    <div class="sidebar-brand-header">
      <a
        class="sidebar-brand-link"
        [routerLink]="home()"
        (click)="closeSidebar()"
        [attr.aria-label]="'common.home' | t"
        [title]="'common.home' | t"
      >
        <div class="brand-logo-icon">
          <img
            src="/images/logo-light.png"
            width="40"
            height="40"
            [alt]="'common.appName' | t"
            decoding="async"
          />
        </div>
        <div class="brand-text-block">
          <strong class="brand-app-name">{{ 'common.waslaPlatform' | t }}</strong>
          <span class="brand-app-tagline">{{ 'common.betterCare' | t }}</span>
        </div>
      </a>

      <!-- Desktop Collapse Button -->
      <button
        type="button"
        class="btn-sidebar-collapse"
        (click)="toggleSidebarCollapse()"
        [attr.aria-label]="isSidebarCollapsed() ? ('sidebar.expand' | t) : ('sidebar.collapse' | t)"
        [title]="isSidebarCollapsed() ? ('sidebar.expand' | t) : ('sidebar.collapse' | t)"
      >
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <path d="M9 3v18" />
          <path d="m14 9 3 3-3 3" class="collapse-chevron" />
        </svg>
      </button>

      <!-- Mobile Close Button -->
      <button
        type="button"
        class="btn-sidebar-close"
        (click)="closeSidebar()"
        [attr.aria-label]="'common.closeMenu' | t"
      >
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>

    <!-- Navigation List -->
    <nav class="sidebar-nav">
      @for (item of roleNavItems(); track item.id) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          class="sidebar-nav-item"
          [title]="item.labelKey | t"
          (click)="closeSidebar()"
        >
          <svg
            class="sidebar-nav-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            @switch (item.icon) {
              @case ('home') {
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
              }
              @case ('calendar') {
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
                <line x1="3" y1="10" x2="21" y2="10" />
              }
              @case ('clock') {
                <circle cx="12" cy="12" r="10" />
                <polyline points="12 6 12 12 16 14" />
              }
              @case ('stethoscope') {
                <path d="M4.5 3v5a3.5 3.5 0 0 0 7 0V3" />
                <path d="M8 11.5v3.5a4.5 4.5 0 0 0 9 0v-2.5" />
                <circle cx="17" cy="10" r="2" />
              }
              @case ('building') {
                <path d="M3 21h18M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16M9 9h6M9 13h6M9 17h6" />
              }
              @case ('users') {
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
              }
              @case ('ticket') {
                <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z" />
                <line x1="13" y1="5" x2="13" y2="19" stroke-dasharray="2 2" />
              }
              @case ('heart-pulse') {
                <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
                <path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27" />
              }
              @case ('user-check') {
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <polyline points="16 11 18 13 22 9" />
              }
              @case ('clipboard-list') {
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" />
                <line x1="16" y1="13" x2="8" y2="13" />
                <line x1="16" y1="17" x2="8" y2="17" />
                <polyline points="10 9 9 9 8 9" />
              }
              @default {
                <circle cx="12" cy="12" r="8" />
              }
            }
          </svg>
          <span class="nav-text">{{ item.labelKey | t }}</span>
        </a>
      }
    </nav>

    <!-- Sidebar Bottom: Logout -->
    <div class="sidebar-footer">
      <button
        class="btn-sidebar-logout"
        type="button"
        (click)="logout()"
        [attr.aria-label]="'common.logout' | t"
        [title]="'common.logout' | t"
      >
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        <span class="nav-text">{{ 'common.logout' | t }}</span>
      </button>
    </div>
  </aside>

  <!-- Main Content Layout (Topbar + Body) -->
  <div class="portal-main-wrapper">
    <header class="portal-topbar">
      <div class="topbar-start">
        <!-- Mobile Drawer Button -->
        <button
          type="button"
          class="btn-mobile-menu"
          (click)="toggleSidebar()"
          [attr.aria-label]="'common.openSidebar' | t"
        >
          <svg
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
      </div>

      <div class="topbar-end">
        <div class="lang-pill-holder">
          <app-language-switcher variant="header" />
        </div>

        <div class="user-profile" [title]="user()?.userName ?? ''">
          <div class="user-squircle-avatar">
            <span class="avatar-letter">{{ userInitial() }}</span>
          </div>
          <div class="user-text-cluster">
            <strong class="user-display-name">{{ user()?.userName }}</strong>
            <span class="user-role-label">{{ userRole() }}</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Content Area -->
    <main class="portal-content-body">
      <router-outlet />
    </main>
  </div>
</div>
