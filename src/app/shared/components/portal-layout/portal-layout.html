<div class="portal-shell" [class.reception-portal]="isReception()" [dir]="langService.dir()">
  <!-- Mobile Sidebar Backdrop Overlay -->
  @if (isSidebarOpen()) {
    <div class="sidebar-backdrop" (click)="closeSidebar()" aria-hidden="true"></div>
  }

  <!-- Persistent Collapsible Sidebar -->
  <aside
    class="portal-sidebar"
    id="portal-sidebar"
    [class.open]="isSidebarOpen()"
    [class.collapsed]="isSidebarCollapsed() && !isSidebarOpen()"
    [attr.aria-label]="'sidebar.workspace' | t"
  >
    <!-- Sidebar Brand -->
    <div class="sidebar-brand-header">
      <a
        class="sidebar-brand-link"
        [routerLink]="home()"
        (click)="closeSidebar()"
        [attr.aria-label]="'common.home' | t"
        [title]="'common.home' | t"
      >
        <div class="brand-logo-icon">
          <img
            src="/images/logo-light.png"
            width="40"
            height="40"
            [alt]="'common.appName' | t"
            decoding="async"
          />
        </div>
        <div class="brand-text-block">
          <strong class="brand-app-name">{{ 'common.waslaPlatform' | t }}</strong>
          <span class="brand-app-tagline">{{ 'common.betterCare' | t }}</span>
        </div>
      </a>

      <!-- Desktop Collapse Button -->
      <button
        type="button"
        class="btn-sidebar-collapse"
        (click)="toggleSidebarCollapse()"
        [attr.aria-label]="isSidebarCollapsed() ? ('sidebar.expand' | t) : ('sidebar.collapse' | t)"
        [title]="isSidebarCollapsed() ? ('sidebar.expand' | t) : ('sidebar.collapse' | t)"
      >
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <path d="M9 3v18" />
          <path d="m14 9 3 3-3 3" class="collapse-chevron" />
        </svg>
      </button>

      <!-- Mobile Close Button -->
      <button
        type="button"
        class="btn-sidebar-close"
        (click)="closeSidebar()"
        [attr.aria-label]="'common.closeMenu' | t"
      >
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>

    <!-- Navigation List -->
    <nav class="sidebar-nav">
      @for (item of roleNavItems(); track item.id) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          class="sidebar-nav-item"
          [title]="item.labelKey | t"
          (click)="closeSidebar()"
        >
          <svg
            class="sidebar-nav-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path [attr.d]="navigationIcons[item.icon]" />
          </svg>
          <span class="nav-text">{{ item.labelKey | t }}</span>
        </a>
      }
    </nav>

    <!-- Sidebar Bottom: Logout -->
    <div class="sidebar-footer">
      <button
        class="btn-sidebar-logout"
        type="button"
        (click)="logout()"
        [attr.aria-label]="'common.logout' | t"
        [title]="'common.logout' | t"
      >
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        <span class="nav-text">{{ 'common.logout' | t }}</span>
      </button>
    </div>
  </aside>

  <!-- Main Content Layout (Topbar + Body) -->
  <div class="portal-main-wrapper">
    <app-header
      [user]="user()"
      [home]="home()"
      menuId="portal-sidebar"
      [menuExpanded]="isSidebarOpen()"
      (menuToggle)="toggleSidebar()"
      (logout)="logout()"
    >
      @if (user()?.userType === 'Reception') {
        <div class="topbar-practice-selector" [dir]="langService.dir()">
          <label for="reception-current-practice" class="practice-selector-label">
            <svg
              viewBox="0 0 24 24"
              width="15"
              height="15"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M3 21h18M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16M9 9h6M9 13h6M9 17h6" />
            </svg>
            <span>{{ 'reservations.practice' | t }}</span>
          </label>
          <div class="practice-select-wrap">
            <select
              id="reception-current-practice"
              [value]="practiceContext.currentPracticeId()"
              [disabled]="practiceContext.isLoading() || !practiceContext.practices().length"
              (change)="selectPractice($event)"
            >
              <option value="" [selected]="!practiceContext.currentPracticeId()">
                {{ 'reservations.choose' | t }}
              </option>
              @for (practice of practiceContext.practices(); track practice.id) {
                <option
                  [value]="practice.id"
                  [selected]="practice.id === practiceContext.currentPracticeId()"
                >
                  {{
                    (langService.isRtl() ? practice.nameAr : practice.nameEn || practice.nameAr) ||
                      ('ui.full.762' | t)
                  }}
                </option>
              }
            </select>
            <svg
              class="select-chevron"
              viewBox="0 0 24 24"
              width="14"
              height="14"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </div>
        </div>
      }
    </app-header>

    <!-- Page Content Area -->
    <main class="portal-content-body">
      <router-outlet />
    </main>
    <app-mobile-navigation
      [items]="mobileNavItems()"
      menuId="portal-sidebar"
      [menuExpanded]="isSidebarOpen()"
      (more)="toggleSidebar()"
      (navigate)="closeSidebar()"
    />
  </div>
</div>
