@if (opened()) {
  <div class="drawer-backdrop" (click)="onBackdropClick()" aria-hidden="true"></div>
  <aside
    class="side-drawer-panel"
    [style.max-width]="width()"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title() || 'لوحة جانبية'"
  >
    <header class="drawer-header">
      <div class="drawer-heading-wrap">
        <div class="drawer-brand-indicator" aria-hidden="true">
          <span class="indicator-dot"></span>
        </div>
        <div class="drawer-titles">
          <h2>{{ title() }}</h2>
          @if (description()) {
            <p>{{ description() }}</p>
          }
        </div>
      </div>
      <button
        type="button"
        class="drawer-close-btn"
        [disabled]="busy()"
        (click)="close()"
        aria-label="إغلاق اللوحة"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </header>

    <div class="drawer-body">
      <ng-content />
    </div>
  </aside>
}
