<app-side-drawer
  [opened]="!!source()"
  [title]="'common.privatePdf' | t"
  width="min(100vw, 960px)"
  (closed)="close()"
>
  <p>{{ 'common.pdfViewerHelp' | t }}</p>
  @if (source(); as url) {
    <iframe class="pdf-document" [src]="url" [title]="'common.privatePdf' | t"></iframe>
  }
</app-side-drawer>
